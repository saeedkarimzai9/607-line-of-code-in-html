<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Coin Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#070714;color:#fff}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(96vw,900px);height:min(92vh,650px)}
canvas{width:100%;height:100%;display:block;border:2px solid #3b3b7a;border-radius:18px;background:#09091a;box-shadow:0 0 35px #16164a}
#hud{position:absolute;inset:14px 18px auto;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;font-size:18px;text-shadow:0 0 10px #7ff}
#help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;opacity:.7;pointer-events:none;white-space:nowrap}
#menu{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,5,18,.82);border-radius:18px;text-align:center}
.panel{padding:30px 42px;border:1px solid #5151a5;border-radius:20px;background:rgba(15,15,40,.9);box-shadow:0 0 40px #24246a}
h1{margin:0 0 8px;font-size:42px;letter-spacing:4px;color:#75f7ff;text-shadow:0 0 18px #0ff}
p{margin:8px 0 20px;color:#c8c8e8}
button{border:0;border-radius:999px;padding:13px 30px;font-weight:bold;font-size:17px;cursor:pointer;color:#061016;background:#73f8ff;box-shadow:0 0 18px #21dbe8}
button:hover{filter:brightness(1.15);transform:scale(1.03)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="900" height="650"></canvas>
<div id="hud"><span id="score">Score: 0</span><span id="best">Best: 0</span><span id="lives">Lives: 3</span></div>
<div id="help">Move with WASD / Arrow Keys • Collect cyan coins • Avoid red drones</div>
<div id="menu"><div class="panel"><h1>NEON COIN RUSH</h1><p id="message">Grab coins and survive as long as you can.</p><button id="start">START GAME</button></div></div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const livesEl=document.getElementById("lives");
const menu=document.getElementById("menu");
const message=document.getElementById("message");
const startBtn=document.getElementById("start");
const W=canvas.width;
const H=canvas.height;
let keys={};
let score=0;
let best=Number(localStorage.getItem("neonBest")||0);
let lives=3;
let running=false;
let last=0;
let spawnTimer=0;
let coinTimer=0;
let shake=0;
let particles=[];
let enemies=[];
let coins=[];
const player={
 x:W/2,
 y:H/2,
 r:18,
 speed:330,
 inv:0
};
bestEl.textContent="Best: "+best;
document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.key.toLowerCase()==="p"&&running)running=false;
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
startBtn.addEventListener("click",start);
canvas.addEventListener("pointerdown",e=>{
 if(!running)return;
 const r=canvas.getBoundingClientRect();
 player.x=(e.clientX-r.left)*W/r.width;
 player.y=(e.clientY-r.top)*H/r.height;
});
function start(){
 score=0;
 lives=3;
 running=true;
 last=performance.now();
 spawnTimer=0;
 coinTimer=0;
 shake=0;
 particles=[];
 enemies=[];
 coins=[];
 player.x=W/2;
 player.y=H/2;
 player.inv=1.2;
 menu.classList.add("hidden");
 updateHud();
 requestAnimationFrame(loop);
}
function gameOver(){
 running=false;
 if(score>best){
  best=score;
  localStorage.setItem("neonBest",best);
 }
 bestEl.textContent="Best: "+best;
 message.textContent="Game over! You scored "+score+".";
 startBtn.textContent="PLAY AGAIN";
 menu.classList.remove("hidden");
}
function updateHud(){
 scoreEl.textContent="Score: "+score;
 bestEl.textContent="Best: "+best;
 livesEl.textContent="Lives: "+lives;
}
function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function spawnCoin(){
 const pad=45;
 coins.push({x:rand(pad,W-pad),y:rand(pad,H-pad),r:10,pulse:rand(0,6.28)});
}
function spawnEnemy(){
 const side=Math.floor(rand(0,4));
 let x=0,y=0;
 if(side===0){x=-30;y=rand(0,H)}
 if(side===1){x=W+30;y=rand(0,H)}
 if(side===2){x=rand(0,W);y=-30}
 if(side===3){x=rand(0,W);y=H+30}
 const speed=rand(80,125)+Math.min(score*1.2,120);
 enemies.push({x,y,r:15,speed,angle:0});
}
function burst(x,y,count=14){
 for(let i=0;i<count;i++){
  const a=rand(0,Math.PI*2);
  const s=rand(40,190);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.8),max:.8,size:rand(2,5)});
 }
}
function update(dt){
 let dx=0,dy=0;
 if(keys["w"]||keys["arrowup"])dy-=1;
 if(keys["s"]||keys["arrowdown"])dy+=1;
 if(keys["a"]||keys["arrowleft"])dx-=1;
 if(keys["d"]||keys["arrowright"])dx+=1;
 if(dx||dy){
  const len=Math.hypot(dx,dy);
  player.x+=dx/len*player.speed*dt;
  player.y+=dy/len*player.speed*dt;
 }
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));
 player.y=Math.max(player.r,Math.min(H-player.r,player.y));
 player.inv=Math.max(0,player.inv-dt);
 spawnTimer+=dt;
 coinTimer+=dt;
 const interval=Math.max(.32,1.05-score*.006);
 if(spawnTimer>interval){spawnTimer=0;spawnEnemy()}
 if(coinTimer>1.15){coinTimer=0;spawnCoin()}
 enemies.forEach(e=>{
  const dx=player.x-e.x;
  const dy=player.y-e.y;
  const len=Math.hypot(dx,dy)||1;
  e.x+=dx/len*e.speed*dt;
  e.y+=dy/len*e.speed*dt;
  e.angle+=dt*4;
 });
 for(let i=coins.length-1;i>=0;i--){
  const c=coins[i];
  c.pulse+=dt*5;
  if(dist(player,c)<player.r+c.r){
   score++;
   burst(c.x,c.y,12);
   coins.splice(i,1);
   if(score%10===0)lives=Math.min(5,lives+1);
  }
 }
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  if(player.inv<=0&&dist(player,e)<player.r+e.r){
   lives--;
   player.inv=1.5;
   shake=.25;
   burst(player.x,player.y,22);
   enemies.splice(i,1);
   if(lives<=0){updateHud();gameOver();return}
  }
  if(e.x<-100||e.x>W+100||e.y<-100||e.y>H+100)enemies.splice(i,1);
 }
 particles.forEach(p=>{
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=Math.pow(.03,dt);
  p.vy*=Math.pow(.03,dt);
  p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);
 shake=Math.max(0,shake-dt);
 updateHud();
}
function drawBackground(t){
 const g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,600);
 g.addColorStop(0,"#14144a");
 g.addColorStop(1,"#050510");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="rgba(80,120,255,.08)";
 ctx.lineWidth=1;
 const offset=(t*.025)%50;
 for(let x=-50+offset;x<W+50;x+=50){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=-50+offset;y<H+50;y+=50){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
}
function drawCoin(c){
 const glow=12+Math.sin(c.pulse)*4;
 ctx.save();
 ctx.shadowBlur=glow;
 ctx.shadowColor="#42ffff";
 ctx.fillStyle="#64ffff";
 ctx.beginPath();
 ctx.arc(c.x,c.y,c.r+Math.sin(c.pulse)*1.5,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#0b5360";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText("$",c.x,c.y+1);
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);
 ctx.rotate(e.angle);
 ctx.shadowBlur=16;
 ctx.shadowColor="#ff315c";
 ctx.fillStyle="#ff315c";
 ctx.beginPath();
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const r=i%2?e.r*.58:e.r;
  ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
 }
 ctx.closePath();
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#300617";
 ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);
 if(player.inv>0&&Math.floor(player.inv*12)%2===0)ctx.globalAlpha=.35;
 ctx.shadowBlur=22;
 ctx.shadowColor="#7dffff";
 ctx.fillStyle="#7dffff";
 ctx.beginPath();
 ctx.arc(0,0,player.r,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#092c38";
 ctx.beginPath();
 ctx.arc(0,0,7,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle="#72ffff";
  ctx.fillRect(p.x,p.y,p.size,p.size);
 });
 ctx.globalAlpha=1;
}
function draw(t){
 ctx.save();
 if(shake>0)ctx.translate(rand(-5,5),rand(-5,5));
 drawBackground(t);
 coins.forEach(drawCoin);
 enemies.forEach(drawEnemy);
 drawParticles();
 drawPlayer();
 ctx.restore();
}
function loop(t){
 if(!running)return;
 const dt=Math.min(.033,(t-last)/1000);
 last=t;
 update(dt);
 draw(t);
 if(running)requestAnimationFrame(loop);
}
function idle(){
 if(running)return;
 drawBackground(performance.now());
 ctx.save();
 ctx.globalAlpha=.18;
 for(let i=0;i<12;i++){
  const x=(performance.now()*.04+i*97)%W;
  const y=(i*73)%H;
  ctx.fillStyle="#63ffff";
  ctx.beginPath();
  ctx.arc(x,y,2,0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
 requestAnimationFrame(idle);
}
idle();
</script>
</body>
